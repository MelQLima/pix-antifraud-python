services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      ANTIFRAUDE_DATABASE_URL: postgresql+psycopg://antifraude:antifraude@postgres:5432/antifraude
      ANTIFRAUDE_MODEL_DIR: /app/models
    volumes: ["models:/app/models"]
    depends_on:
      postgres: { condition: service_healthy }

  trainer: # one-off: docker compose run --rm trainer
    build: .
    command: ["antifraude-train", "--dataset", "/tmp/train.parquet", "--model-dir", "/app/models"]
    volumes: ["models:/app/models"]
    profiles: ["train"]

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: antifraude, POSTGRES_PASSWORD: antifraude, POSTGRES_DB: antifraude }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antifraude"]
      interval: 3s
      retries: 20

volumes:
  models:
